[project]
name = "docx-agent"
version = "0.1.0"
description = "LangGraph agent that edits existing .docx documents from natural-language instructions while preserving untouched content and formatting."
readme = "README.md"
authors = [{ name = "imhauke" }]
requires-python = ">=3.12"
dependencies = [
    "langchain-anthropic>=1.7.10",
    "langchain-core>=1.8.1",
    "langgraph>=1.2.22",
    "lxml>=6.1.3",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
    "rich>=15.0.0",
    "typer>=0.29.1",
]

[project.scripts]
docx-agent = "docx_agent.cli:app"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.170.15",
    "lxml-stubs>=0.5.1",
    "mypy>=2.4.1",
    "pillow>=13.0.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "python-docx>=1.2.0",
    "pyyaml>=6.0.3",
    "ruff>=0.17.5",
    "types-pyyaml>=6.0.12.20261113",
]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["evals/reports"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PT", "N", "C4", "PL"]
ignore = [
    "PLR0913", # many args is fine for tool signatures
    "PLR2004", # magic values in tests
    "PLR0911",
    "PLR0912",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "S101"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["docx.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
addopts = "-ra --strict-markers"
markers = [
    "live: calls a real LLM API (never in CI; run explicitly with -m live)",
]

[tool.coverage.run]
source = ["docx_agent"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]
