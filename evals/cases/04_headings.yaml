id: heading_hierarchy
source: heading_outline
instruction: >-
  Rename chapter one to just "Overview". Apply Word Heading 1, Heading 2 and Heading 3
  to the chapter, subsection and sub-subsection according to their numbering depth.
  Keep all other text unchanged.
changed_before: [p1, p2, p3]
style_changes: {p1: Heading1, p2: Heading2, p3: Heading3}
blocks:
  - block_id: p1
    equals: Overview
    style: Heading1
  - block_id: p2
    equals: 1.1 Motivation
    style: Heading2
  - block_id: p3
    equals: 1.1.1 Scope
    style: Heading3
  - block_id: p4
    unchanged: true
